name: Go

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -p 1 -timeout 10m ./...
      - name: Vet
        # The native/BOF loaders use intentional Windows pointer arithmetic.
        run: go vet -unsafeptr=false ./...
      - name: Build
        run: go build -buildvcs=false ./cmd/undertow
      - name: Build thin agent
        run: go build -buildvcs=false ./cmd/undertow-agent
      - name: Build Windows integration binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o bin/undertow.exe ./cmd/undertow
          go build -trimpath -buildvcs=false -ldflags='-s -w -H=windowsgui' -o bin/undertow-agent-windows-amd64.exe ./cmd/undertow-agent
          go run ./tools/agentmanifest bin dev undertow-agent-windows-amd64.exe
      - name: Test configured agent over WebSocket, QUIC, and DNS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tools/test-agent-distribution.ps1
      - name: Build release templates
        if: matrix.os == 'ubuntu-latest'
        run: sh tools/build-release.sh dist
      - name: Upload thin agent templates
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: undertow-agent-templates
          path: dist/undertow-agent-*
